<div class="login-container" style="background-color: darkslategray;" >
  <div class="card shadow-sm p-4 border-0 rounded-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
      <div class="mb-3">
        <span class="fs-1">📦</span>
      </div>
      <h2 class="fw-bold fs-3">Bienvenido</h2>
      <p class="text-muted small">Inicia sesión en tu cuenta</p>
    </div>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="username" class="form-label small fw-semibold">Nombre de Usuario</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-person text-muted">👤</i></span>
          <input type="text" id="username" class="form-control border-start-0 ps-0" formControlName="username" placeholder="Ingresa tu usuario">
        </div>
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="text-danger small mt-1">
          El nombre de usuario es requerido.
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label small fw-semibold">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-lock text-muted">🔒</i></span>
          <input type="password" id="password" class="form-control border-start-0 ps-0" formControlName="password" placeholder="Ingresa tu contraseña">
        </div>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger small mt-1">
          La contraseña es requerida.
        </div>
      </div>

      <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-primary fw-semibold py-2 shadow-sm">
          Iniciar Sesión
        </button>
      </div>
    </form>
  </div>
</div>
