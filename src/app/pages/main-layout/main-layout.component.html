<nav class="navbar navbar-expand-lg bg-secondary mb-4" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/" (click)="cerrarMenu()">
      <i class="bi bi-cash-stack"></i> Caja Control
    </a>
    <button
      class="navbar-toggler"
      type="button"
      (click)="isMenuCollapsed = !isMenuCollapsed"
      [attr.aria-expanded]="!isMenuCollapsed"
      aria-controls="navbarText"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText" [ngbCollapse]="isMenuCollapsed">
      <!-- Menú principal: cada grupo abre su submenú (definido en MENU, en el componente) -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        @for (grupo of menu(); track grupo.label) {
          <li class="nav-item" ngbDropdown display="static">
            <button type="button" class="nav-link d-flex align-items-center gap-2" ngbDropdownToggle
                    [class.active]="grupoActivo(grupo)">
              <i [class]="'bi ' + grupo.icono"></i> {{ grupo.label }}
            </button>
            <div ngbDropdownMenu>
              @for (opcion of grupo.opciones; track opcion.ruta) {
                <a ngbDropdownItem class="d-flex align-items-center gap-2" [routerLink]="opcion.ruta"
                   [class.active]="opcionActiva(opcion)" [attr.aria-current]="opcionActiva(opcion) ? 'page' : null"
                   (click)="cerrarMenu()">
                  <i [class]="'bi ' + opcion.icono"></i> {{ opcion.label }}
                </a>
              }
            </div>
          </li>
        }
      </ul>

      <!-- Usuario y cierre de sesión -->
      <ul class="navbar-nav mb-2 mb-lg-0">
        <li class="nav-item" ngbDropdown display="static" placement="bottom-end">
          <button type="button" class="nav-link d-flex align-items-center gap-2" ngbDropdownToggle>
            <i class="bi bi-person-circle"></i>
            {{ authService.currentUser()?.name }}
            <span class="badge bg-dark">{{ getRoleLabel(authService.currentUser()?.role) }}</span>
          </button>
          <div ngbDropdownMenu class="dropdown-menu-lg-end">
            <span class="dropdown-item-text small text-secondary">{{ authService.currentUser()?.email }}</span>
            <div class="dropdown-divider"></div>
            <button type="button" ngbDropdownItem class="d-flex align-items-center gap-2 text-danger-emphasis" (click)="onLogout()">
              <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <router-outlet></router-outlet>
</div>
